[plugin]
name="OIP Fault Injection"
description="Inject faults to test PLC fault handling. Pick a device, then choose from the fault catalog (drive trip, overspeed, underspeed, belt slip, per-line roller fault, drive-fault signal, blocked photo-eye) — only the faults valid for that device are enabled. Faults are held every frame; Clear restores. Includes an advanced direct comms-tag force."
author="LCI"
version="1.0"
script="plugin.gd"
